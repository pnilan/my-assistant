[project]
name = "my-assistant-server"
version = "0.1.0"
description = "Voice assistant backend: FastAPI + Pydantic AI + MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-ai>=0.0.14",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_assistant"]
